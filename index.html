<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Registro Gym</title>
<style>
  :root{
    --bg: #f4f7f4;
    --bg-panel: #ffffff;
    --bg-panel-2: #eef2ee;
    --line: #d7ded7;
    --amber: #1f9d55;
    --amber-dim: #a9d9bb;
    --text: #1b241d;
    --text-dim: #6d786e;
    --danger: #d9534f;
    --ok: #1f9d55;
    --radius: 14px;
    font-size: 16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    min-height:100vh;
    padding-bottom:90px;
  }
  header.top{
    position:sticky; top:0; z-index:50;
    background:linear-gradient(180deg, #f4f7f4 0%, #f4f7f4dd 90%, transparent);
    backdrop-filter: blur(6px);
    padding:18px 18px 10px;
    border-bottom:1px solid var(--line);
  }
  .brand{
    display:flex; align-items:baseline; gap:8px;
  }
  .brand .mark{
    font-family: 'Arial Black', sans-serif;
    font-weight:900;
    font-size:1.6rem;
    letter-spacing:-0.5px;
    color:var(--amber);
  }
  .brand .sub{
    font-size:0.75rem;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--text-dim);
  }
  nav.tabs{
    display:flex;
    gap:6px;
    margin-top:14px;
    overflow-x:auto;
    padding-bottom:2px;
  }
  nav.tabs button{
    flex:none;
    background:transparent;
    border:1px solid var(--line);
    color:var(--text-dim);
    padding:8px 14px;
    border-radius:999px;
    font-size:0.82rem;
    font-weight:600;
    letter-spacing:0.3px;
    white-space:nowrap;
  }
  nav.tabs button.active{
    background:var(--amber);
    border-color:var(--amber);
    color:#ffffff;
  }
  main{padding:16px;}
  .view{display:none;}
  .view.active{display:block;}

  .card{
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:14px;
  }
  .card h2{
    margin:0 0 12px;
    font-size:1rem;
    letter-spacing:0.5px;
    color:var(--amber);
    text-transform:uppercase;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .row-label{
    font-size:0.75rem;
    color:var(--text-dim);
    text-transform:uppercase;
    letter-spacing:0.5px;
    margin-bottom:6px;
    display:block;
  }
  input[type=date], select, input[type=number]{
    width:100%;
    background:var(--bg-panel-2);
    border:1px solid var(--line);
    color:var(--text);
    padding:11px 10px;
    border-radius:10px;
    font-size:0.95rem;
  }
  select:focus, input:focus{ outline:2px solid var(--amber); outline-offset:1px; }

  .block-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
  }
  .block-chip{
    border:1px solid var(--line);
    background:var(--bg-panel-2);
    border-radius:10px;
    padding:12px 10px;
    text-align:center;
    font-size:0.85rem;
    font-weight:600;
  }
  .block-chip.selected{
    border-color:var(--amber);
    background:#dcf3e3;
    color:var(--amber);
  }

  .machine{
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 12px;
    margin-bottom:8px;
    background:var(--bg-panel-2);
  }
  .machine .m-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:8px;
  }
  .machine .m-name{ font-weight:600; font-size:0.92rem; }
  .machine .m-tag{
    font-size:0.65rem;
    color:var(--bg);
    background:var(--text-dim);
    padding:2px 7px;
    border-radius:6px;
    letter-spacing:0.5px;
    font-weight:700;
  }
  .machine .m-fields{
    display:grid;
    grid-template-columns:1fr 70px;
    gap:8px;
  }
  .disc-calc{
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:10px;
    padding:8px;
  }
  .disc-grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:6px;
  }
  .disc-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
  }
  .disc-item .disc-label{
    font-size:0.68rem;
    color:var(--text-dim);
    font-weight:700;
  }
  .disc-item .disc-label::after{ content:"kg"; margin-left:2px; font-weight:400; }
  input.disc-count{
    width:100%;
    text-align:center;
    padding:6px 2px;
    font-size:0.85rem;
  }
  .disc-total{
    text-align:center;
    margin-top:8px;
    font-weight:700;
    font-size:0.9rem;
    color:var(--amber);
  }
  .instances-container{
    grid-column: 1 / -1;
  }
  .instance-row{
    border:1px dashed var(--line);
    border-radius:10px;
    padding:8px;
    margin-bottom:8px;
    background:var(--bg);
  }
  .instance-row .sel-accessory{
    margin-bottom:6px;
  }
  .instance-row .instance-fields{
    display:grid;
    grid-template-columns:1fr 70px;
    gap:8px;
  }
  .btn-remove-instance{
    width:100%;
    background:transparent;
    border:none;
    color:var(--danger);
    font-size:0.7rem;
    margin-top:6px;
    padding:2px;
  }
  .btn-add-instance{
    grid-column: 1 / -1;
    width:100%;
    background:transparent;
    border:1px dashed var(--amber);
    color:var(--amber);
    padding:8px;
    border-radius:10px;
    font-size:0.8rem;
    font-weight:700;
  }
  .toggle-row{
    display:flex; align-items:center; gap:8px; margin-bottom:8px;
  }
  .toggle-row input{ width:18px; height:18px; accent-color:var(--amber); }

  button.primary{
    width:100%;
    background:var(--amber);
    color:#ffffff;
    border:none;
    padding:14px;
    border-radius:12px;
    font-weight:800;
    font-size:0.95rem;
    letter-spacing:0.5px;
    text-transform:uppercase;
  }
  button.secondary{
    width:100%;
    background:transparent;
    color:var(--text-dim);
    border:1px solid var(--line);
    padding:12px;
    border-radius:12px;
    font-weight:600;
    font-size:0.85rem;
    margin-top:8px;
  }
  .empty{
    color:var(--text-dim);
    font-size:0.85rem;
    text-align:center;
    padding:30px 10px;
  }
  .session-item{
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px;
    margin-bottom:10px;
    background:var(--bg-panel-2);
  }
  .session-item .s-date{
    font-weight:700; color:var(--amber); font-size:0.9rem;
  }
  .session-item .s-blocks{
    font-size:0.72rem; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.5px; margin:2px 0 8px;
  }
  .session-item .s-line{
    display:flex; justify-content:space-between;
    font-size:0.85rem;
    padding:3px 0;
    border-top:1px dashed var(--line);
  }
  .session-item .s-line:first-of-type{ border-top:none; }
  .del-btn{
    background:transparent; border:1px solid var(--danger); color:var(--danger);
    font-size:0.7rem; padding:4px 10px; border-radius:8px; float:right;
  }
  select.machine-select{
    margin-bottom:12px;
  }
  .chart-wrap{
    background:var(--bg-panel-2);
    border-radius:10px;
    padding:10px;
    overflow-x:auto;
  }
  svg text{ font-family: inherit; }
  .pending-note{
    font-size:0.72rem;
    color:var(--amber-dim);
    margin-top:6px;
  }
  .stat-row{
    display:flex; gap:8px; margin-top:10px;
  }
  .stat{
    flex:1;
    background:var(--bg-panel-2);
    border-radius:10px;
    padding:10px;
    text-align:center;
  }
  .stat .n{ font-size:1.3rem; font-weight:800; color:var(--amber); }
  .stat .l{ font-size:0.65rem; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.5px; }
  footer.note{
    text-align:center;
    color:var(--text-dim);
    font-size:0.7rem;
    padding:20px 30px;
  }
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <span class="mark">MI GYM</span>
    <span class="sub">registro diario</span>
  </div>
  <nav class="tabs">
    <button data-view="nueva" class="active">+ Sesión</button>
    <button data-view="historial">Historial</button>
    <button data-view="progreso">Progreso</button>
  </nav>
</header>

<main>

  <!-- ===== NUEVA SESION ===== -->
  <section id="view-nueva" class="view active">
    <div class="card">
      <h2>Fecha</h2>
      <input type="date" id="inputFecha">
    </div>

    <div class="card">
      <h2>Bloques de hoy</h2>
      <div class="block-grid" id="blockGrid"></div>
    </div>

    <div id="machinesContainer"></div>

    <button class="primary" id="btnGuardar">Guardar sesión</button>
  </section>

  <!-- ===== HISTORIAL ===== -->
  <section id="view-historial" class="view">
    <div class="card">
      <h2>☁️ Respaldo en Google Drive</h2>
      <span class="row-label">Link de tu Apps Script</span>
      <input type="url" id="inputBackupUrl" placeholder="https://script.google.com/macros/s/.../exec" style="margin-bottom:8px;">
      <button class="secondary" id="btnSaveBackupUrl">Guardar link</button>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px;">
        <button class="secondary" id="btnSyncNow">Sincronizar ahora</button>
        <button class="secondary" id="btnRestoreCloud">Restaurar desde Drive</button>
      </div>
      <div id="cloudStatus" style="font-size:0.75rem; color:var(--text-dim); margin-top:8px; text-align:center;"></div>
    </div>
    <div class="card">
      <h2>Sesiones registradas</h2>
      <div id="historialList"><div class="empty">Aún no hay sesiones guardadas.</div></div>
    </div>
  </section>

  <!-- ===== PROGRESO ===== -->
  <section id="view-progreso" class="view">
    <div class="card">
      <h2>Progreso por máquina</h2>
      <select class="machine-select" id="progresoMachineSelect"></select>
      <div id="progresoStats" class="stat-row"></div>
      <div class="chart-wrap" id="chartWrap"><div class="empty">Selecciona una máquina con historial.</div></div>
    </div>
  </section>

</main>

<footer class="note">Datos guardados solo en este dispositivo/navegador · Año 2026</footer>

const STORAGE_KEY = "gym_sessions_2026";
const DRAFT_KEY = "gym_draft_session";
const BACKUP_URL_KEY = "gym_backup_url";
const DEFAULT_BACKUP_URL = "https://script.google.com/macros/s/AKfycbxrYM7Nh70-l_Kj1nwVvW9T3__N4MabQSpZ2Db5bh5L0vxbYVEkPKCwUK2Nxm-h-ftT/exec";

function getBackupUrl(){
  return localStorage.getItem(BACKUP_URL_KEY) || DEFAULT_BACKUP_URL;
}

async function syncSessionToCloud(session){
  const url = getBackupUrl();
  if(!url) return;
  try{
    await fetch(url, {
      method: "POST",
      headers: {"Content-Type": "text/plain;charset=utf-8"},
      body: JSON.stringify(session)
    });
  }catch(e){
    console.warn("No se pudo respaldar la sesión en la nube:", e);
  }
}

async function syncAllSessionsToCloud(){
  const statusEl = document.getElementById("cloudStatus");
  if(statusEl) statusEl.textContent = "Sincronizando...";
  let ok = 0, fail = 0;
  for(const s of sessions){
    try{
      await syncSessionToCloud(s);
      ok++;
    }catch(e){ fail++; }
  }
  if(statusEl) statusEl.textContent = `✅ ${ok} sesiones sincronizadas${fail ? `, ${fail} fallaron` : ""}.`;
}

async function restoreFromCloud(){
  const url = getBackupUrl();
  const statusEl = document.getElementById("cloudStatus");
  if(!url){ if(statusEl) statusEl.textContent = "Configura primero el link de respaldo."; return; }
  if(statusEl) statusEl.textContent = "Restaurando desde Drive...";
  try{
    const res = await fetch(url);
    const remoteSessions = await res.json();
    const localIds = new Set(sessions.map(s=>s.id));
    let added = 0;
    remoteSessions.forEach(rs=>{
      if(!localIds.has(rs.id)){
        sessions.push(rs);
        added++;
      }
    });
    saveSessions(sessions);
    renderHistorial();
    if(statusEl) statusEl.textContent = `✅ Se restauraron ${added} sesiones nuevas desde Drive.`;
  }catch(e){
    console.warn(e);
    if(statusEl) statusEl.textContent = "⚠️ No se pudo conectar con Drive. Revisa el link.";
  }
}


function loadSessions(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  }catch(e){ return []; }
}
function saveSessions(sessions){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions));
}

function discCalculatorHtml(){

function weightOptionsHtml(machine){
  if(machine.type === "L1"){
    return L1_WEIGHTS.map(w=>`<option value="${w}">${w} kg</option>`).join("");
  }
  if(machine.type === "L2"){
    return L2_WEIGHTS.map(w=>`<option value="${w}">${w} kg</option>`).join("");
  }
  if(machine.type === "fixed_lbs"){
    if(!machine.table || machine.table.length === 0){
      return `<option value="" disabled selected>Pesos aún no registrados</option>`;
    }
    return machine.table.map(o=>`<option value="${o.kg}">${o.kg} kg (${o.lbs} lbs)</option>`).join("");
  }
  if(machine.type === "fixed_kg"){
    return machine.table.map(w=>`<option value="${w}">${w} kg</option>`).join("");
  }
  return "";
}

function renderMachines(){
  machinesContainer.innerHTML = "";
  if(selectedBlocks.size === 0) return;

  // evitar duplicar la misma máquina física (ej. polea1) si aparece en 2 bloques seleccionados
  const seen = new Set();

  selectedBlocks.forEach(blockName=>{
    const machines = BLOCKS[blockName];
    if(!machines || machines.length === 0) return;

    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `<h2>${blockName}</h2>`;

    machines.forEach(m=>{
      const uniqueKey = blockName + "::" + m.id;
      if(seen.has(m.id) && blockName !== [...selectedBlocks][0]){
        // ya se mostró esta máquina física en otro bloque seleccionado, se omite duplicado visual
      }
      seen.add(m.id);

      const wrap = document.createElement("div");
      wrap.className = "machine";
      wrap.dataset.machineId = m.id;
      wrap.dataset.machineName = m.name;
      wrap.dataset.blockName = blockName;
      wrap.dataset.machineType = m.type;

      const tagLabel = m.type === "L1" ? "L1 · Mancuerna" :
                        m.type === "L2" ? "L2 · Disco" :
                        m.type === "fixed_lbs" ? "Peso fijo" :
                        m.type === "fixed_kg" ? "Peso fijo" :
                        m.type === "bodyweight" ? "Peso corporal" : "";

      let fieldsBlockHtml;
      if(m.accessories){
        fieldsBlockHtml = `
          <div class="instances-container">${instanceRowHtml(m, 0)}</div>
          <button type="button" class="btn-add-instance">+ Registrar con otro accesorio</button>
        `;
      } else if(m.type === "bodyweight"){
        fieldsBlockHtml = `<input type="number" class="inp-reps-bw" placeholder="repeticiones" min="0" style="grid-column:1;">
           <input type="number" class="inp-extra-kg" placeholder="+ peso kg (opc.)" min="0" style="grid-column:2;">`;
      } else if(m.type === "L2"){
        fieldsBlockHtml = `${discCalculatorHtml()}
           <input type="number" class="inp-reps" placeholder="reps" min="0" style="grid-column: 1 / -1;">`;
      } else {
        fieldsBlockHtml = `<select class="sel-weight">${weightOptionsHtml(m)}</select>
           <input type="number" class="inp-reps" placeholder="reps" min="0">`;
      }

      wrap.innerHTML = `
        <div class="toggle-row">
          <input type="checkbox" class="chk-used">
          <span class="m-name">${m.name}</span>
          <span class="m-tag" style="margin-left:auto">${tagLabel}</span>
        </div>
        <div class="m-fields" style="display:none;">
          ${fieldsBlockHtml}
        </div>
        ${m.pending ? `<div class="pending-note">⏳ ${m.pending}</div>` : ""}
      `;

      const chk = wrap.querySelector(".chk-used");
      const fields = wrap.querySelector(".m-fields");
      chk.addEventListener("change", ()=>{
        fields.style.display = chk.checked ? "grid" : "none";
      });

      if(m.type === "L2"){
        const discInputs = wrap.querySelectorAll(".disc-count");
        const totalSpan = wrap.querySelector(".disc-total-value");
        const recalc = ()=>{
          let total = 0;
          discInputs.forEach(inp=>{
            const denom = parseFloat(inp.dataset.denom);
            const count = parseInt(inp.value) || 0;
            total += denom * count;
          });
          totalSpan.textContent = total;
        };
        discInputs.forEach(inp=> inp.addEventListener("input", recalc));
      }

      if(m.accessories){
        const container = wrap.querySelector(".instances-container");
        const addBtn = wrap.querySelector(".btn-add-instance");
        addBtn.addEventListener("click", ()=>{
          const idx = container.querySelectorAll(".instance-row").length;
          const div = document.createElement("div");
          div.innerHTML = instanceRowHtml(m, idx).trim();
          const newRow = div.firstElementChild;
          container.appendChild(newRow);
          const removeBtn = newRow.querySelector(".btn-remove-instance");
          if(removeBtn){
            removeBtn.addEventListener("click", ()=> newRow.remove());
          }
        });
      }

      card.appendChild(wrap);
    });

    if(machines.length === 0){
      card.innerHTML += `<div class="empty">Bloque pendiente de completar.</div>`;
    }

    machinesContainer.appendChild(card);
  });
}

document.getElementById("btnGuardar").addEventListener("click", ()=>{
  const fecha = inputFecha.value;
  if(!fecha){ alert("Selecciona una fecha."); return; }
  if(selectedBlocks.size === 0){ alert("Selecciona al menos un bloque."); return; }

  const entries = [];
  const usedBlocksSet = new Set();
  document.querySelectorAll(".machine").forEach(el=>{
    const chk = el.querySelector(".chk-used");
    if(chk && chk.checked){

      if(el.querySelector(".instances-container")){
        // Máquina con accesorios: puede tener varias instancias (ej. Polea con soga, luego con barra)
        el.querySelectorAll(".instance-row").forEach(row=>{
          const weight = parseFloat(row.querySelector(".sel-weight").value);
          if(isNaN(weight)){ return; } // pesos aún no registrados, se omite
          const repsVal = row.querySelector(".inp-reps").value;
          const reps = repsVal ? parseInt(repsVal) : null;
          const accessory = row.querySelector(".sel-accessory").value;
          entries.push({
            machineId: el.dataset.machineId,
            machineName: el.dataset.machineName,
            block: el.dataset.blockName,
            weightKg: weight,
            reps: reps,
            metric: "weight",
            accessory: accessory,
            discBreakdown: null
          });
        });
        usedBlocksSet.add(el.dataset.blockName);
        return;
      }

      const isBodyweight = el.dataset.machineType === "bodyweight";
      const isDiscCalc = el.dataset.machineType === "L2";
      let weight = null, reps = null, discBreakdown = null;

      if(isBodyweight){
        const repsVal = el.querySelector(".inp-reps-bw").value;
        if(!repsVal){ return; } // sin repeticiones, se omite
        reps = parseInt(repsVal);
        const extra = el.querySelector(".inp-extra-kg").value;
        weight = extra ? parseFloat(extra) : 0;
      } else if(isDiscCalc){
        const discInputs = el.querySelectorAll(".disc-count");
        let total = 0;
        const parts = [];
        discInputs.forEach(inp=>{
          const denom = parseFloat(inp.dataset.denom);
          const count = parseInt(inp.value) || 0;
          if(count > 0){
            total += denom * count;
            parts.push(`${count}x${denom}kg`);
          }
        });
        weight = total;
        discBreakdown = parts.length ? parts.join(" + ") : null;
        const repsVal = el.querySelector(".inp-reps").value;
        reps = repsVal ? parseInt(repsVal) : null;
      } else {
        weight = parseFloat(el.querySelector(".sel-weight").value);
        if(isNaN(weight)){
          return; // máquina con pesos aún no registrados, se omite
        }
        const repsVal = el.querySelector(".inp-reps").value;
        reps = repsVal ? parseInt(repsVal) : null;
      }

      entries.push({
        machineId: el.dataset.machineId,
        machineName: el.dataset.machineName,
        block: el.dataset.blockName,
        weightKg: weight,
        reps: (reps === null || reps === undefined || isNaN(reps)) ? null : reps,
        metric: isBodyweight ? "reps" : "weight",
        accessory: null,
        discBreakdown: discBreakdown
      });
      usedBlocksSet.add(el.dataset.blockName);
    }
  });

  if(entries.length === 0){
    alert("Marca al menos una máquina que hayas usado.");
    return;
  }

  const session = {
    id: Date.now().toString(),
    date: fecha,
    blocks: [...selectedBlocks],
    entries
  };
  sessions.push(session);
  saveSessions(sessions);
  localStorage.removeItem(DRAFT_KEY);
  syncSessionToCloud(session); // respaldo en segundo plano, no bloquea

  alert("Sesión guardada ✅");
  selectedBlocks = new Set();
  renderBlockGrid();
  renderMachines();
});

function collectDraft(){
  const draft = {
    date: inputFecha.value,
    selectedBlocks: [...selectedBlocks],
    machines: {}
  };
  document.querySelectorAll(".machine").forEach(el=>{
    const key = el.dataset.blockName + "::" + el.dataset.machineId;
    const chk = el.querySelector(".chk-used");
    const entry = { checked: chk ? chk.checked : false };

    if(el.querySelector(".instances-container")){
      entry.instances = [];
      el.querySelectorAll(".instance-row").forEach(row=>{
        entry.instances.push({
          accessory: row.querySelector(".sel-accessory").value,
          weight: row.querySelector(".sel-weight").value,
          reps: row.querySelector(".inp-reps").value
        });
      });
    } else if(el.dataset.machineType === "bodyweight"){
      const repsBw = el.querySelector(".inp-reps-bw");
      const extraKg = el.querySelector(".inp-extra-kg");
      entry.repsBw = repsBw ? repsBw.value : "";
      entry.extraKg = extraKg ? extraKg.value : "";
    } else if(el.dataset.machineType === "L2"){
      entry.discs = {};
      el.querySelectorAll(".disc-count").forEach(inp=>{
        entry.discs[inp.dataset.denom] = inp.value;
      });
      const rp = el.querySelector(".inp-reps");
      entry.reps = rp ? rp.value : "";
    } else {
      const sw = el.querySelector(".sel-weight");
      const rp = el.querySelector(".inp-reps");
      if(sw) entry.weight = sw.value;
      if(rp) entry.reps = rp.value;
    }
    const acc = el.querySelector(".sel-accessory");
    if(acc && !el.querySelector(".instances-container")) entry.accessory = acc.value;

    draft.machines[key] = entry;
  });
  try{
    localStorage.setItem(DRAFT_KEY, JSON.stringify(draft));
  }catch(e){ /* ignora errores de storage */ }
}

function showDraftBanner(){
  const main = document.querySelector("main");

  banner.textContent = "↩️ Se recuperó tu sesión sin guardar.";

function restoreDraftIfExists(){
  let raw;
  try{ raw = localStorage.getItem(DRAFT_KEY); }catch(e){ return; }
  if(!raw) return;
  let draft;
  try{ draft = JSON.parse(raw); }catch(e){ return; }
  if(!draft || !draft.machines) return;

  if(draft.date) inputFecha.value = draft.date;
  selectedBlocks = new Set(draft.selectedBlocks || []);
  renderBlockGrid();
  renderMachines();

  document.querySelectorAll(".machine").forEach(el=>{
    const key = el.dataset.blockName + "::" + el.dataset.machineId;
    const entry = draft.machines[key];
    if(!entry) return;

    if(entry.instances){
      const container = el.querySelector(".instances-container");
      if(container){
        // asegurar que existan tantas filas como instancias guardadas
        while(container.querySelectorAll(".instance-row").length < entry.instances.length){
          const addBtn = el.querySelector(".btn-add-instance");
          if(addBtn) addBtn.click();
          else break;
        }
        const rows = container.querySelectorAll(".instance-row");
        entry.instances.forEach((inst, i)=>{
          const row = rows[i];
          if(!row) return;
          const accSel = row.querySelector(".sel-accessory");
          const wSel = row.querySelector(".sel-weight");
          const rInp = row.querySelector(".inp-reps");
          if(accSel && inst.accessory !== undefined) accSel.value = inst.accessory;
          if(wSel && inst.weight !== undefined) wSel.value = inst.weight;
          if(rInp && inst.reps) rInp.value = inst.reps;
        });
      }
    } else if(el.dataset.machineType === "bodyweight"){
      const repsBw = el.querySelector(".inp-reps-bw");
      const extraKg = el.querySelector(".inp-extra-kg");
      if(repsBw && entry.repsBw) repsBw.value = entry.repsBw;
      if(extraKg && entry.extraKg) extraKg.value = entry.extraKg;
    } else if(el.dataset.machineType === "L2"){
      if(entry.discs){
        el.querySelectorAll(".disc-count").forEach(inp=>{
          if(entry.discs[inp.dataset.denom] !== undefined) inp.value = entry.discs[inp.dataset.denom];
        });
        const totalSpan = el.querySelector(".disc-total-value");
        if(totalSpan){
          let total = 0;
          el.querySelectorAll(".disc-count").forEach(inp=>{
            total += parseFloat(inp.dataset.denom) * (parseInt(inp.value) || 0);
          });
          totalSpan.textContent = total;
        }
      }
      const rp = el.querySelector(".inp-reps");
      if(rp && entry.reps) rp.value = entry.reps;
    } else {
      const sw = el.querySelector(".sel-weight");
      const rp = el.querySelector(".inp-reps");
      if(sw && entry.weight !== undefined) sw.value = entry.weight;
      if(rp && entry.reps) rp.value = entry.reps;
    }
    const acc = el.querySelector(".sel-accessory");
    if(acc && entry.accessory !== undefined) acc.value = entry.accessory;

    const chk = el.querySelector(".chk-used");
    if(entry.checked && chk){
      chk.checked = true;
      chk.dispatchEvent(new Event("change"));
    }
  });

  showDraftBanner();
}

function renderHistorial(){
  const list = document.getElementById("historialList");
  if(sessions.length === 0){
    list.innerHTML = `<div class="empty">Aún no hay sesiones guardadas.</div>`;
    return;
  }
  const sorted = [...sessions].sort((a,b)=> b.date.localeCompare(a.date));
  list.innerHTML = "";
  sorted.forEach(s=>{
    const div = document.createElement("div");
    div.className = "session-item";
    const fechaFmt = formatFechaLarga(s.date);
    div.innerHTML = `
      <button class="del-btn" data-id="${s.id}">Eliminar</button>
      <div class="s-date">${fechaFmt}</div>
      <div class="s-blocks">${s.blocks.join(" · ")}</div>
      ${s.entries.map(e=>`
        <div class="s-line">
          <span>${e.machineName}${e.accessory ? ` · ${e.accessory}` : ""}${e.metric === "reps" ? "" : (e.reps ? ` (${e.reps} reps)`:"")}</span>
          <span>${e.metric === "reps" ? `${e.reps} reps${e.weightKg ? ` + ${e.weightKg}kg` : ""}` : `${e.weightKg} kg`}</span>
        </div>
        ${e.discBreakdown ? `<div style="font-size:0.7rem;color:var(--text-dim);margin:-4px 0 6px;">${e.discBreakdown}</div>` : ""}
      `).join("")}
    `;
    list.appendChild(div);
  });

  list.querySelectorAll(".del-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      if(confirm("¿Eliminar esta sesión?")){
        sessions = sessions.filter(s=>s.id !== btn.dataset.id);
        saveSessions(sessions);
        renderHistorial();
      }
    });
  });
}

function formatFechaLarga(iso){
  const d = new Date(iso + "T00:00:00");
  const dias = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
  const meses = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
  return `${dias[d.getDay()]} ${d.getDate()} ${meses[d.getMonth()]} ${d.getFullYear()}`;
}

}

function renderProgresoSelect(){
  const sel = document.getElementById("progresoMachineSelect");
  const machinesMap = getAllMachinesFlat();

  // solo listar máquinas que tienen al menos un registro
  const usedIds = new Set();
  sessions.forEach(s=>s.entries.forEach(e=>usedIds.add(e.machineId)));

  sel.innerHTML = "";
  if(usedIds.size === 0){
    sel.innerHTML = `<option>Sin datos aún</option>`;
    document.getElementById("chartWrap").innerHTML = `<div class="empty">Registra al menos una sesión para ver progreso.</div>`;
    document.getElementById("progresoStats").innerHTML = "";
    return;
  }
  [...usedIds].forEach(id=>{
    const opt = document.createElement("option");
    opt.value = id;
    opt.textContent = machinesMap.get(id) || id;
    sel.appendChild(opt);
  });
  sel.onchange = ()=> renderChart(sel.value);
  renderChart(sel.value);
}

function renderChart(machineId){
  const points = [];
  let isReps = false;
  sessions.forEach(s=>{
    s.entries.forEach(e=>{
      if(e.machineId === machineId){
        if(e.metric === "reps"){
          isReps = true;
          points.push({date: s.date, weight: e.reps});
        } else {
          points.push({date: s.date, weight: e.weightKg});
        }
      }
    });
  });
  points.sort((a,b)=> a.date.localeCompare(b.date));

  const unitLabel = isReps ? "reps" : "kg";
  const statsDiv = document.getElementById("progresoStats");
  const chartWrap = document.getElementById("chartWrap");

  if(points.length === 0){
    chartWrap.innerHTML = `<div class="empty">Sin registros para esta máquina.</div>`;
    statsDiv.innerHTML = "";
    return;
  }

  const max = Math.max(...points.map(p=>p.weight));
  const min = Math.min(...points.map(p=>p.weight));
  const last = points[points.length-1].weight;
  statsDiv.innerHTML = `
    <div class="stat"><div class="n">${last}</div><div class="l">Último (${unitLabel})</div></div>
    <div class="stat"><div class="n">${max}</div><div class="l">Máximo (${unitLabel})</div></div>
    <div class="stat"><div class="n">${points.length}</div><div class="l">Registros</div></div>
  `;

  const w = Math.max(320, points.length * 60);
  const h = 180;
  const padL = 40, padR = 20, padT = 20, padB = 30;
  const innerW = w - padL - padR;
  const innerH = h - padT - padB;

  const range = (max - min) || 1;
  const xStep = points.length > 1 ? innerW / (points.length - 1) : 0;

  const coords = points.map((p,i)=>{
    const x = padL + (points.length > 1 ? i * xStep : innerW/2);
    const y = padT + innerH - ((p.weight - min) / range) * innerH;
    return {x, y, p};
  });

  const pathD = coords.map((c,i)=> (i===0?"M":"L") + c.x.toFixed(1) + "," + c.y.toFixed(1)).join(" ");

  const circles = coords.map(c=>
    `<circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="4" fill="#1f9d55" />`
  ).join("");

  const labels = coords.map(c=>{
    const d = new Date(c.p.date + "T00:00:00");
    const lbl = `${d.getDate()}/${d.getMonth()+1}`;
    return `<text x="${c.x.toFixed(1)}" y="${h-8}" font-size="10" fill="#6d786e" text-anchor="middle">${lbl}</text>`;
  }).join("");

  const weightLabels = coords.map(c=>
    `<text x="${c.x.toFixed(1)}" y="${(c.y-10).toFixed(1)}" font-size="10" fill="#1b241d" text-anchor="middle">${c.p.weight}</text>`
  ).join("");

  chartWrap.innerHTML = `
    <svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
      <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${padT+innerH}" stroke="#d7ded7" />
      <line x1="${padL}" y1="${padT+innerH}" x2="${padL+innerW}" y2="${padT+innerH}" stroke="#d7ded7" />
      <path d="${pathD}" fill="none" stroke="#1f9d55" stroke-width="2.5" />
      ${circles}
      ${weightLabels}
      ${labels}
    </svg>
  `;
}
</script>
